apiVersion: v1
kind: Pod
metadata:
  name: {{POD_NAME}}
spec:
  containers:
    - name: {{CONTAINER_NAME}}
      image: {{IMAGE_NAME}}
      resources:
        limits:
          cpu: "{{CPU_LIMIT}}"
          memory: "{{MEMORY_LIMIT}}Mi"
      securityContext:
        pidsLimit: {{PIDS_LIMIT}}
      restartPolicy: "{{RESTART_POLICY}}"
      ports:
        - containerPort: 80
          hostPort: 8080
